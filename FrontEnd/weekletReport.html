<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS-files/header.css">
         <link rel="stylesheet" href="CSS-files/general.css">
         <link rel="stylesheet" href="CSS-files/sidebar.css">
         <link rel="stylesheet" href="CSS-files/weekley-overview.css">
         <link rel="stylesheet" href="./CSS-files/shareWeekletreport.css">
        <title>HourFlow</title>
        <link rel="icon" href="./logo/download.png">
    </head>
    <body>
        <header>
            <div class="left-header">
                <img class="logo" src="logo/logo.png.png">

            </div>
            <div class="middle-header">
               <input class="Search-bar" placeholder="Search by employ name">
                <button class="search-button">
                    <img class="search-icon" src="icons/searchIcon.png">
                </button>
            </div>
            <div class="right-header">
                <img class="notification-img" src="icons/notification.png">
                <div class="profile-pic-div">
                    <img class="profile-image" src="logo/logo.png.png"> 
                </div>

            </div>

        </header>
        <sidebar>
            <div class="middle-sidebar">
                <div class="Dashboard-div">
                    <img class="dashboard-image" src="icons/dashboard.png" alt="My Image">
                    <p class="dashboard-text">Dashboard</p>
                </div>
                <a href="employes.html" class="employes-div">
                    <img class="employes-logo" src="icons/employ.png">
                    <p class="employ-text">Employes</p>
                </a>
                <div class="setting-div">
                    <img class="setting-image" src="icons/setting.png">
                    <p class="setting-text">Settings</p>
                </div>
                 <a href="weekletReport.html" class="WeekLey=report-div setting-div">
                    <img class="setting-image" src="icons/weeklet-icon.png.png">
                    <p class="setting-text"> Weekley Report</p>
                </a>

            </div>
        </sidebar>
        <main>
            <div class="Weekley-overview-main-div">
                    <div class="week-buttons-div">
                        <div>
                           <button class="Previous-Next-button js-previous-button">Previous week</button>
                           <button  class="Previous-Next-button js-Next-button">Next week</button>
                        </div>
                        
                        <p class="GoingMonth-Text jsGoingMonth-Text">
                            September Report 
                        </p>
                        <div class="menu-container">
                            <button class="three-dots">⋮</button>

                            <div class="dropdown-menu">
                                <button class="js-WeekeyReport-Button">Make Weekley Report</button>
                                <button>View Details</button>
                                <button>Delete</button>
                            </div>
                        </div>
                       
                    </div>
                    <div class="Weekley-overview-header js-Weekley-overview-header">
                        
                    </div>
                    <div class="Weekley-report-main-div  js-Weekley-report-main-div">


                    </div>
                    
                    <div class="shared-weekley-report-background">
                            <div class="report-container js-sharing-weekley-report-container">

                                

                            </div>                
                    </div>
                

            </div>

        </main>

    </body>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="script/weeklet-overview.js" type="module"></script>
    <script src="script/shareWeekleyHours.js" type="module"></script>
</html>
