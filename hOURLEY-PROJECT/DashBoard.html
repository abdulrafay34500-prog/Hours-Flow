<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="header.css">
         <link rel="stylesheet" href="general.css">
         <link rel="stylesheet" href="sidebar.css">
         <link rel="stylesheet" href="weekley-overview.css">
        <title>HourFlow</title>
    </head>
    <body>
        <header>
            <div class="left-header">
                <img class="logo" src="logo/logo.png.png">

            </div>
            <div class="middle-header">
               <input class="Search-bar" placeholder="Search by employ name">
                <button class="search-button">
                    <img class="search-icon" src="icons/searchIcon.png">
                </button>
            </div>
            <div class="right-header">
                <img class="notification-img" src="icons/notification.png">
                <div class="profile-pic-div">
                    <img class="profile-image" src="logo/logo.png.png"> 
                </div>

            </div>

        </header>
        <sidebar>
            <div class="middle-sidebar">
                <div class="Dashboard-div">
                    <img class="dashboard-image" src="icons/dashboard.png" alt="My Image">
                    <p class="dashboard-text">Dashboard</p>
                </div>
                <a href="employes.html" class="employes-div">
                    <img class="employes-logo" src="icons/employ.png">
                    <p class="employ-text">Employes</p>
                </a>
                <div class="setting-div">
                    <img class="setting-image" src="icons/setting.png">
                    <p class="setting-text">Settings</p>
                </div>
                 <a href="DashBoard.html" class="WeekLey=report-div setting-div">
                    <img class="setting-image" src="icons/weeklet-icon.png.png">
                    <p class="setting-text"> Weekley Report</p>
                </a>

            </div>
        </sidebar>
        <main>
            <div class="Weekley-overview-main-div">
                    <div class="week-buttons-div">
                        <button class="Previous-Next-button">Previous week</button>
                        <button  class="Previous-Next-button">Next week</button>

                    </div>
                    <div class="Weekley-overview-header js-Weekley-overview-header">
                        
                    </div>
                    <div class="Weekley-report-main-div  js-Weekley-report-main-div">


                    </div>
            </div>

        </main>

    </body>
    <script src="script/weeklet-overview.js" type="module"></script>
</html>
