<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="CSS-files/header.css">
         <link rel="stylesheet" href="CSS-files/general.css">
         <link rel="stylesheet" href="CSS-files/sidebar.css">
         <link rel="stylesheet" href="CSS-files/weekley-overview.css">
         <link rel="stylesheet" href="CSS-files/employes.css">
         <link rel="stylesheet" href="CSS-files/addingemploypage.css">
         <link rel="stylesheet" href="CSS-files/singleEmployDetail.css">
        <title>Employes Details</title>
    </head>
    <body>
        <header>
            <div class="left-header">
                <img class="logo" src="logo/logo.png.png">

            </div>
            <div class="middle-header">
               <input class="Search-bar" placeholder="Search by employ name">
                <button class="search-button">
                    <img class="search-icon" src="icons/searchIcon.png">
                </button>
            </div>
            <div class="right-header">
                <img class="notification-img" src="icons/notification.png">
                <div class="profile-pic-div">
                    <img class="profile-image" src="logo/logo.png.png"> 
                </div>

            </div>

        </header>
        <sidebar>
            <div class="middle-sidebar">
                <div class="Dashboard-div">
                    <img class="dashboard-image" src="icons/dashboard.png" alt="My Image">
                    <p class="dashboard-text">Dashboard</p>
                </div>
                <a href="employes.html" class="employes-div">
                    <img class="employes-logo" src="icons/employ.png">
                    <p class="employ-text">Employes</p>
                </a>
                <div class="setting-div">
                    <img class="setting-image" src="icons/setting.png">
                    <p class="setting-text">Settings</p>
                </div>
                <a href="DashBoard.html" class="WeekLey=report-div setting-div">
                    <img class="setting-image" src="icons/weeklet-icon.png.png">
                    <p class="setting-text"> Weekley Report</p>
                </a>

            </div>
        </sidebar>
        <main class="main-addingEmploy-page">

            <div class="combining-AddingAndSingle-Employ-div  js-combining-AddingAndSingle-Employ-div">
                <div class="Adding-Employe-main-div">
                    <div class="Employe-main-header">
                        <div class="header-text-div">
                            <p class="employes-text">Employees</p>
                            <p class="manage-team-text">Manage your team members and their details</p>

                        </div>
                        <button class="add-button js-add-employ-button">
                            + Add Employe 
                        </button>
                    </div>
                    <div class="employ-hours-payroll-div">
                        <div class="Total-employ-div">
                            <img class="employ-icon" src="icons/employ.png">
                            <p class="total-employ-text">Total Employes</p>
                            <p class="Employe-numbers js-Employe-numbers">0</p>
                        </div>
                        <div class="Total-Hours-div">
                            <img class="clock-icon" src="icons/clock.png">
                            <p class="total-Hours-text">Total Hours (This Month)</p>
                            <p class="Total-hours-numbers">0</p>
                        </div>
                        <div class="Total-Payroll-div">
                            <img class="currency-icon" src="icons/rupee.png">
                            <p class="total-Payroll-text">Total Payroll (This Month)</p>
                            <p class="monthly-Payroll-Amount">0</p>
                        </div>
                    </div>
                    <div class="Employe-Details-main-div">
                        <div class="Employer-Details-mainHeader">
                            <p class="Employ-id">ID</p>
                            <P class="Employ-namee">Employ Name</P>
                            <p class="Employ-ShiftTypee">Shift Type</p>
                        </div>
                        <div class="added-Employes-details js-added-Employes-details">
                        
                            
                        </div>

                    </div>
                </div>
               
                <div class="Single-employ-detail js-Single-employ-detail">



                </div>

            </div>

            <div class="AddingEmploye-main-page js-AddingEmploye-main-page">
                    
            </div>
        </main>


    </body>
    <script src="script/addingEmploy.js" type="module"></script>
</html>
