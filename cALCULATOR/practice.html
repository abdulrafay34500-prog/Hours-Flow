<!DOCTYPE html>
<html>
    <head>
        <title>Calculator</title>
       <link rel="stylesheet" href="practice.css">
    </head>
    <body>

        <div class="Calculator">
            <header>
                <p class="Calculation-screen">

                </p>

            </header>
            <main>
                <div class="all-button-div">
                    <button data-value="1" class="js-Buttons Buttons">1</button>
                    <button data-value="2"  class="js-Buttons Buttons">2</button>
                    <button data-value="3"  class="js-Buttons Buttons">3</button>
                    <button data-value="4"  class="js-Buttons Buttons">4</button>
                    <button data-value="5"  class="js-Buttons Buttons">5</button>
                    <button data-value="6"  class="js-Buttons Buttons">6</button>
                    <button data-value="7"  class="js-Buttons Buttons">7</button>
                    <button data-value="8"  class="js-Buttons Buttons">8</button>
                    <button data-value="9"  class="js-Buttons Buttons">9</button>
                    <button data-value="+"  class="js-Buttons Buttons">+</button>
                    <button data-value="-"  class="js-Buttons Buttons">-</button>
                    <button data-value="*"  class="js-Buttons Buttons">*</button>
                    <button data-value="/"  class="js-Buttons Buttons">/</button>
                    <button data-value="="  class="js-Buttons Buttons">=</button>
                </div>

            </main>
        </div>

       <script src="practice.js">
     
       </script>
    </body>
</html>
